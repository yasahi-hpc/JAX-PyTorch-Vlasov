[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlp4d-torch"
version = "0.0.1"
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=7.0",
  "numpy",
  "xarray[io]",
  "xarray[viz]",
  "matplotlib",
  "joblib",
  "torch",
  "torchvision",
  "crc32c"
]

[tool.hatch.build.targets.wheel]
packages = ["python"]

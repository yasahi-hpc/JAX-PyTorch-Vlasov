[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlp4d-jax"
version = "0.0.1"
# FIXME do not understand why it fails with readme = "../../README.md"
# No `readme`: hatchling rejects a path outside the project directory
# ("Readme path must be within the project directory: ../../README.md").
requires-python = ">=3.10"
dependencies = [
  "pytest>=7.0",
  "numpy",
  "xarray[io]",
  "xarray[viz]",
  "matplotlib",
  "joblib",
  "jax",
  "crc32c"
]

[tool.hatch.build.targets.wheel]
packages = ["python"]

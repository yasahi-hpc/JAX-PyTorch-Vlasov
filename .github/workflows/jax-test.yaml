name: CI (jax)

on:
  pull_request:
    branches: [ "main" ]
  
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jax_changed: ${{ steps.changed-files.outputs.jax_changed }}
    steps:
      - name: Detect changed JAX files
        id: changed-files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            jax_changed:
              - 'simulations/heat3d/jax/**'
              - 'simulations/stream/jax/**'
              - 'simulations/vlasov1d_1v/jax/**'
              - 'simulations/vlasov2d_2v/jax/**'

  test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.jax_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Install dependencies and package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade hatch "virtualenv<21"
          cd python_scripts/jax_env && hatch build && pip install .

      - name: Test stream with pytest
        run: |
          PYTHONPATH=$PWD/simulations/stream/jax:$PYTHONPATH pytest simulations/stream/jax/tests/

      - name: Test heat simulations with pytest
        run: |
          PYTHONPATH=$PWD/simulations/heat3d/jax:$PYTHONPATH pytest simulations/heat3d/jax/tests/

      - name: Test vlasov simulations with pytest
        run: |
          PYTHONPATH=$PWD/simulations/vlasov1d_1v/jax:$PYTHONPATH pytest simulations/vlasov1d_1v/jax/tests/
          PYTHONPATH=$PWD/simulations/vlasov2d_2v/jax:$PYTHONPATH pytest simulations/vlasov2d_2v/jax/tests/